services:
  - type: web
    name: msds-warning-label-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MAX_UPLOAD_BYTES
        value: 26214400
      - key: MAX_UPLOAD_FILES
        value: 10
      - key: RATE_LIMIT_REQUESTS
        value: 30
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: ALLOWED_ORIGINS
        value: http://localhost:8000,http://127.0.0.1:8000,https://subtle-jalebi-51af67.netlify.app
      - key: ALLOWED_ORIGIN_REGEX
        value: https://(?:[a-z0-9-]+--)?subtle-jalebi-51af67\.netlify\.app
